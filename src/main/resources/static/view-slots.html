<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Parking Slots - Smart Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-parking me-2"></i>SmartParking</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-items"></ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row mb-5 align-items-end">
            <div class="col-md-4 mb-3 mb-md-0">
                <h2 class="fw-bold">Find a Parking Spot</h2>
                <p class="text-muted mb-0">Select a location to see available slots</p>
            </div>
            <div class="col-md-4 text-center mb-3 mb-md-0">
                <button id="useLocationBtn" class="btn btn-outline-primary w-100">
                    <i class="fas fa-location-crosshairs me-2"></i>Find Nearest to Me
                </button>
                <div id="locationStatus" class="form-text mt-2"></div>
            </div>
            <div class="col-md-4 text-md-end">
                <select id="locationSelect" class="form-select form-select-lg">
                    <option value="">Select Location...</option>
                </select>
            </div>
        </div>
        
        <div class="row mb-4 justify-content-center">
            <div class="col-md-8 text-center">
                <div class="btn-group" role="group" aria-label="Vehicle Type Filter" id="vehicleTypeFilter">
                    <input type="radio" class="btn-check" name="vType" id="typeAll" value="" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="typeAll">All Vehicles</label>

                    <input type="radio" class="btn-check" name="vType" id="typeTwo" value="Two-Wheeler" autocomplete="off">
                    <label class="btn btn-outline-primary" for="typeTwo"><i class="fas fa-motorcycle me-2"></i>Two-Wheeler</label>

                    <input type="radio" class="btn-check" name="vType" id="typeThree" value="Three-Wheeler" autocomplete="off">
                    <label class="btn btn-outline-primary" for="typeThree"><i class="fas fa-caravan me-2"></i>Three-Wheeler</label>

                    <input type="radio" class="btn-check" name="vType" id="typeFour" value="Four-Wheeler" autocomplete="off">
                    <label class="btn btn-outline-primary" for="typeFour"><i class="fas fa-car me-2"></i>Four-Wheeler</label>
                </div>
            </div>
        </div>

        <div id="slotsContainer" class="row g-4">
            <div class="col-12 text-center py-5">
                <i class="fas fa-map-marker-alt fa-3x text-secondary mb-3"></i>
                <p class="text-muted">Please select a location to view slots</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const locationSelect = document.getElementById('locationSelect');
            const slotsContainer = document.getElementById('slotsContainer');
            const useLocationBtn = document.getElementById('useLocationBtn');
            const locationStatus = document.getElementById('locationStatus');
            const vehicleFilterRadios = document.querySelectorAll('input[name="vType"]');
            let allLocations = [];
            let currentSlots = [];

            function renderLocations(locations) {
                locationSelect.innerHTML = '<option value="">Select Location...</option>';
                locations.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc.id;
                    let text = loc.locationName + ' - ' + loc.address;
                    if (loc.distance !== undefined) {
                        text += ` (${loc.distance.toFixed(1)} km away)`;
                    }
                    opt.textContent = text;
                    locationSelect.appendChild(opt);
                });
            }

            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; // km
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            }

            // Load Locations
            try {
                const res = await fetch('/api/parking/locations');
                allLocations = await res.json();
                renderLocations(allLocations);
            } catch (err) { console.error(err); }

            useLocationBtn.addEventListener('click', () => {
                if (!navigator.geolocation) {
                    locationStatus.innerHTML = '<span class="text-danger">Geolocation not supported</span>';
                    return;
                }
                
                locationStatus.innerHTML = '<span class="text-info"><i class="fas fa-spinner fa-spin me-1"></i>Locating...</span>';
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;
                        
                        allLocations.forEach(loc => {
                            if (loc.latitude && loc.longitude) {
                                loc.distance = calculateDistance(userLat, userLng, loc.latitude, loc.longitude);
                            }
                        });
                        
                        allLocations.sort((a, b) => (a.distance || Infinity) - (b.distance || Infinity));
                        renderLocations(allLocations);
                        
                        locationStatus.innerHTML = '<span class="text-success"><i class="fas fa-check me-1"></i>Found nearest locations!</span>';
                        
                        if (allLocations.length > 0) {
                            locationSelect.value = allLocations[0].id;
                            locationSelect.dispatchEvent(new Event('change'));
                        }
                    },
                    (error) => {
                        console.error(error);
                        locationStatus.innerHTML = '<span class="text-danger">Unable to retrieve location</span>';
                    }
                );
            });

            locationSelect.addEventListener('change', async (e) => {
                const locId = e.target.value;
                if (!locId) return;

                slotsContainer.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';

                try {
                    const res = await fetch(`/api/parking/slots/${locId}`);
                    currentSlots = await res.json();
                    renderSlots();
                } catch (err) { console.error(err); }
            });
            
            // Re-render when filter changes
            vehicleFilterRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    renderSlots();
                });
            });

            function renderSlots() {
                const selectedType = document.querySelector('input[name="vType"]:checked').value;
                
                let filteredSlots = currentSlots;
                if (selectedType) {
                    filteredSlots = currentSlots.filter(s => s.vehicleType === selectedType);
                }

                slotsContainer.innerHTML = '';
                if (filteredSlots.length === 0) {
                    slotsContainer.innerHTML = '<p class="text-center">No slots found matching the criteria.</p>';
                    return;
                }

                filteredSlots.forEach(slot => {
                    const isAvailable = slot.status === 'Available';
                    let iconClass = 'fa-car';
                    if (slot.vehicleType === 'Two-Wheeler') iconClass = 'fa-motorcycle';
                    if (slot.vehicleType === 'Three-Wheeler') iconClass = 'fa-caravan';

                    const col = document.createElement('div');
                    col.className = 'col-md-3 col-sm-6';
                    col.innerHTML = `
                        <div class="card p-3 text-center h-100 shadow-sm">
                            <div class="mb-2">
                                <i class="fas ${iconClass} fa-2x ${isAvailable ? 'text-success' : 'text-danger'}"></i>
                            </div>
                            <h5 class="fw-bold mb-1">Slot ${slot.slotNumber}</h5>
                            <p class="small text-muted mb-2">${slot.vehicleType}</p>
                            <h4 class="text-primary fw-bold mb-3">₹${slot.pricePerHour}<span class="fs-6 text-muted">/hr</span></h4>
                            <span class="slot-badge ${isAvailable ? 'slot-available' : 'slot-booked'} mb-3">
                                ${slot.status}
                            </span>
                            ${isAvailable ?
                            `<button onclick="navigateToBooking(${slot.slotId}, '${slot.slotNumber}', ${slot.pricePerHour}, '${slot.vehicleType}')" class="btn btn-primary btn-sm w-100 mt-auto">Book Now</button>` :
                            `<button class="btn btn-secondary btn-sm w-100 mt-auto" disabled>Occupied</button>`
                        }
                        </div>
                    `;
                    slotsContainer.appendChild(col);
                });
            }
        });

        function navigateToBooking(id, num, price, type) {
            const user = localStorage.getItem('user');
            if (!user) {
                alert('Please login to book a slot');
                window.location.href = 'login.html';
                return;
            }
            localStorage.setItem('temp_slot_id', id);
            localStorage.setItem('temp_slot_num', num);
            localStorage.setItem('temp_slot_price', price);
            localStorage.setItem('temp_slot_type', type);
            window.location.href = 'booking.html';
        }
    </script>
</body>

</html>
