<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Parking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>

<body class="bg-dark">

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-4">
                <div class="card p-5 fade-in shadow-lg">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary"><i class="fas fa-user-shield me-2"></i>Admin</h2>
                        <p class="text-muted">Control Panel Access</p>
                    </div>
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3">Login to Dashboard</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-decoration-none small text-muted">Back to User Site</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const admin = await response.json();
                    localStorage.setItem('admin', JSON.stringify(admin));
                    alert('Admin login successful!');
                    window.location.href = 'admin-dashboard.html';
                } else {
                    alert('Invalid admin credentials');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection failed');
            }
        });
    </script>
</body>

</html>
